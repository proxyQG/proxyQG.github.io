name: Auto-Generate Agent Pages & Sitemap

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'js/data/agents.json'
      - 'index.html'
      - '.github/workflows/generate_agents.yml'
  workflow_run:
    workflows:
      - "Build Tailwind CSS"
      - "Auto-Sync ZZZ Banner Timer (Prydwen)"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: generate-agents
  cancel-in-progress: true

jobs:
  build-agent-pages:
    runs-on: ubuntu-26.04
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v5

      - name: Synchronisation avec la branche main
        run: git pull --rebase origin main

      - name: Génération des pages agents (Zéro Redirection) et du Sitemap
        run: |
          python3 - << 'EOF'
          import json
          import html
          import re
          import shutil
          from datetime import date
          from pathlib import Path
          from urllib.parse import quote

          COLOR_MAP = {
              "Physical": "#e8a838",
              "Fire": "#f05432",
              "Ice": "#00d5be",
              "Electric": "#3182eb",
              "Ether": "#f23c8a",
              "Wind": "#4da2f8",
              "Lumiflux": "#fba2d0",
              "Auric Ink": "#c88e34",
              "Honed Edge": "#e8a838",
              "Frost": "#00d5be",
          }

          with open("js/data/agents.json", "r", encoding="utf-8") as f:
              agents = json.load(f)

          with open("index.html", "r", encoding="utf-8") as f:
              base_html = f.read()

          output_base = Path("agents")
          output_base.mkdir(exist_ok=True)

          valid_names = {agent["name"] for agent in agents if "name" in agent}

          for existing_dir in output_base.iterdir():
              if existing_dir.is_dir() and existing_dir.name not in valid_names:
                  shutil.rmtree(existing_dir)

          today = date.today().isoformat()
          sitemap_urls = [
              "  <url>\n"
              "    <loc>https://proxyqg.github.io/</loc>\n"
              f"    <lastmod>{today}</lastmod>\n"
              "    <changefreq>weekly</changefreq>\n"
              "    <priority>1.0</priority>\n"
              "  </url>"
          ]

          for agent in agents:
              name = agent["name"]
              safe_name = html.escape(name)
              encoded = quote(name, safe="")
              color = COLOR_MAP.get(agent.get("element", ""), "#eab308")
              canonical_url = f"https://proxyqg.github.io/agents/{encoded}/"
              img_url = f"https://proxyqg.github.io/assets/Agents/{encoded}.webp"
              title_str = f"{safe_name} - Guide &amp; Build | ProxyQG"
              og_title = f"{safe_name} - Guide &amp; Build"
              desc_str = f"Découvrez le meilleur build, disques, moteurs et synergies pour {safe_name} sur Zenless Zone Zero."
              og_desc = f"Build complet, disques recommandés, moteurs et compositions pour {safe_name}."

              page_html = base_html

              # 1. Active immédiatement la classe direct-agent-load sur <html>
              page_html = page_html.replace('<html lang="fr">', '<html lang="fr" class="direct-agent-load">', 1)

              # 2. Précharge le guide, l'avatar et (sur PC uniquement) la splash art de l'agent
              agent_preloads = (
                  '<link rel="modulepreload" href="./js/guides/index.js">\n'
                  '    <link rel="modulepreload" href="./js/guides/template.js">\n'
                  f'    <link rel="preload" href="assets/Agents/{encoded}.webp" as="image" fetchpriority="high">\n'
                  f'    <link rel="preload" href="assets/splash/{encoded}.webp" as="image" media="(min-width: 768px)" fetchpriority="high">'
              )
              page_html = re.sub(
                  r'<link rel="preload" href="assets/Agents/[^"]+\.webp" as="image"[^>]*>',
                  agent_preloads,
                  page_html,
                  count=1
              )

              # 3. Remplacement des balises SEO, OpenGraph et Discord
              page_html = re.sub(r'<title>.*?</title>', f'<title>{title_str}</title>', page_html, count=1)
              page_html = re.sub(r'<meta name="description" content="[^"]*">', f'<meta name="description" content="{desc_str}">', page_html, count=1)
              page_html = re.sub(r'<link rel="canonical" href="[^"]*">', f'<link rel="canonical" href="{canonical_url}">', page_html, count=1)

              page_html = re.sub(r'<meta property="og:url" content="[^"]*">', f'<meta property="og:url" content="{canonical_url}">', page_html, count=1)
              page_html = re.sub(r'<meta property="og:title" content="[^"]*">', f'<meta property="og:title" content="{og_title}">', page_html, count=1)
              page_html = re.sub(r'<meta property="og:description" content="[^"]*">', f'<meta property="og:description" content="{og_desc}">', page_html, count=1)
              page_html = re.sub(r'<meta property="og:image" content="[^"]*">', f'<meta property="og:image" content="{img_url}">', page_html, count=1)
              page_html = re.sub(r'<meta property="og:image:width" content="[^"]*">', '<meta property="og:image:width" content="400">', page_html, count=1)
              page_html = re.sub(r'<meta property="og:image:height" content="[^"]*">', '<meta property="og:image:height" content="400">', page_html, count=1)

              page_html = re.sub(r'<meta name="twitter:card" content="[^"]*">', '<meta name="twitter:card" content="summary">', page_html, count=1)
              page_html = re.sub(r'<meta name="twitter:title" content="[^"]*">', f'<meta name="twitter:title" content="{og_title}">', page_html, count=1)
              page_html = re.sub(r'<meta name="twitter:description" content="[^"]*">', f'<meta name="twitter:description" content="{og_desc}">', page_html, count=1)
              page_html = re.sub(r'<meta name="twitter:image" content="[^"]*">', f'<meta name="twitter:image" content="{img_url}">', page_html, count=1)
              page_html = re.sub(r'<meta name="theme-color" content="[^"]*">', f'<meta name="theme-color" content="{color}">', page_html, count=1)

              agent_dir = output_base / name
              agent_dir.mkdir(parents=True, exist_ok=True)

              with open(agent_dir / "index.html", "w", encoding="utf-8") as out:
                  out.write(page_html)

              sitemap_urls.append(
                  "  <url>\n"
                  f"    <loc>{canonical_url}</loc>\n"
                  f"    <lastmod>{today}</lastmod>\n"
                  "    <changefreq>weekly</changefreq>\n"
                  "    <priority>0.8</priority>\n"
                  "  </url>"
              )

          sitemap_xml = (
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              + "\n".join(sitemap_urls) +
              "\n</urlset>\n"
          )

          with open("sitemap.xml", "w", encoding="utf-8") as sm_out:
              sm_out.write(sitemap_xml)
          EOF

      - name: Enregistrement des fichiers générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A agents/ sitemap.xml
          if git diff --staged --quiet; then
            echo "Aucune mise à jour nécessaire."
          else
            git commit -m "perf(seo): generate direct agent pages without client-side redirect"
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main && git push origin main && exit 0
              git rebase --abort 2>/dev/null || true
              sleep $((i * 3))
            done
            echo "Échec du push après 5 tentatives" >&2
            exit 1
          fi
