name: Build Tailwind CSS

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'css/styles.css'
      - 'js/**'
      - '.github/workflows/build_tailwind.yml'
  workflow_dispatch:

concurrency:
  group: build-tailwind
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Sync latest main before build
        run: git pull --rebase origin main

      - name: Auto-detect LCP Hero Agent for preloading
        run: |
          python3 - << 'EOF'
          import json, re

          with open("js/data/agents.json", "r", encoding="utf-8") as f:
              agents = json.load(f)

          hero_agent = agents[-1]["name"] if agents else "Severian"
          print(f"Agent LCP détecté : {hero_agent}")

          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()

          new_preload = f'<link rel="preload" href="assets/Agents/{hero_agent}.webp" as="image" fetchpriority="high">'

          html_updated = re.sub(
              r'<link rel="preload" href="assets/Agents/[^"]+\.webp" as="image"[^>]*>',
              new_preload,
              html
          )

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html_updated)
          EOF

      - name: Compile Tailwind CSS (Static & Minified)
        run: |
          cat << 'EOF' > tailwind.config.js
          module.exports = {
            content: [
              "./index.html",
              "./js/**/*.js"
            ],
            theme: {
              extend: {
                fontFamily: {
                  display: ['Montserrat', 'sans-serif'],
                  sans: ['Inter', 'sans-serif']
                }
              }
            }
          }
          EOF
          npx tailwindcss@3.4.17 -o ./css/tailwind.css --minify
          rm tailwind.config.js

      - name: Commit & Push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html css/tailwind.css
          if ! git diff --cached --quiet; then
            git commit -m "perf: auto-update LCP preload & Tailwind CSS"
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main && git push origin main && exit 0
              git rebase --abort 2>/dev/null || true
              sleep $((i * 3))
            done
            echo "Échec du push après 5 tentatives" >&2
            exit 1
          fi
